name: iOS Kotlin compile check

on:
  workflow_dispatch:

# Compilation is always manual. A new approved run supersedes any older run
# for this branch, preventing duplicate macOS runner usage.
concurrency:
  group: ios-kmp-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-compile:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ios/enable-kmp-targets

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS simulator target
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace
