name: Import SimpMusic v2.5.0 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this iOS port repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout upstream SimpMusic v2.5.0
        uses: actions/checkout@v4
        with:
          repository: maxrave-dev/SimpMusic
          ref: v2.5.0
          path: upstream
          submodules: recursive
          lfs: true

      - name: Import upstream source without upstream automation
        shell: bash
        run: |
          rsync -a --exclude='.git' --exclude='.github/' upstream/ ./
          rm -rf upstream

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import upstream SimpMusic v2.5.0 source"
          git push origin HEAD:main
