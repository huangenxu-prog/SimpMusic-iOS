name: iOS Kotlin compile check

on:
  push:
    branches:
      - ios/enable-kmp-targets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-compile:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ios/enable-kmp-targets

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS simulator target
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace
